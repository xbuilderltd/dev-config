name: Release Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write # To create commits, tags, and releases
      pull-requests: write # To create release PRs
      id-token: write # To publish to npm with provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all history and tags for Changesets to work correctly
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This command is what runs AFTER the Release PR is merged
          publish: pnpm changeset publish
          # These parameters are used to create the Release PR
          title: 'chore: release package'
          commit: 'chore: release package'
          createGithubReleases: true # Set to true to create GH releases after publishing
          setupGitUser: true
        env:
          # GITHUB_TOKEN is required for the action to create PRs and Releases
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN is required for pnpm to publish to the registry
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
